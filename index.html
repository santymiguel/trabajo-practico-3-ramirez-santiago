<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <label for="buscar" class="form-control"
      >ingrese el nombre del personaje</label
    >
    <input type="text" id="buscar" class="" />
    <button id="btnBuscar" class="btn btn-primary">Buscar</button>
    <div
      id="contenedor"
      class="d-flex flex-wrap gap-3 justify-content-center"
    ></div>
    <div class="modal fade" id="modal_personaje" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-3 bg-warning">
          <div class="modal-header">
            <h5 class="modal-title" id="modal_nombre"></h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body d-flex flex-column align-items-center">
            <img id="modal_imagen" src="" alt="" class="img-fluid w-50 mb-2" />
            <p id="modal_nacimiento"></p>
            <p id="modal_edad"></p>
            <p id="modal_genero"></p>
            <p id="modal_ocupacion"></p>
            <p id="modal_estado"></p>
            <p id="modal_frase"></p>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
